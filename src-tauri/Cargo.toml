[package]
name = "assets-viewer"
version = "0.1.0"
description = "Fast local assets viewer"
authors = ["you"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
jwalk = "0.8"
kamadak-exif = "0.5"
chrono = { version = "0.4", features = ["clock"] }
trash = "5"
reverse_geocoder = "4"
isocountry = "0.3"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
